    CancelEmailResponse:
      type: object
      properties:
        object:
          type: string
          enum:
            - email
        id:
          type: string
      required:
        - object
        - id
      additionalProperties: false
    SmtpEmailRequest:
      type: object
      properties:
        from:
          anyOf:
            - type: string
            - type: 'null'
          description: >-
            Verified sender address, optionally formatted as Name <sender@example.com>, or omitted
            when supplied by a published template.
        to:
          anyOf:
            - oneOf:
                - type: string
                - type: array
                  items:
                    type: string
            - type: 'null'
          description: >-
            Recipient address or array, optional when cc or bcc supplies recipients, with up to 50
            recipients across all three fields.
        subject:
          anyOf:
            - type: string
            - type: 'null'
          description: >-
            Email subject, required unless supplied by a published template.
        cc:
          anyOf:
            - oneOf:
                - type: string
                - type: array
                  items:
                    type: string
              description: >-
                Email address or array of up to 50 addresses.
            - type: 'null'
          description: >-
            Cc address or array of addresses, counted toward the 50-recipient total.
        bcc:
          anyOf:
            - oneOf:
                - type: string
                - type: array
                  items:
                    type: string
              description: >-
                Email address or array of up to 50 addresses.
            - type: 'null'
          description: >-
            Bcc address or array of addresses, counted toward the 50-recipient total.
        reply_to:
          anyOf:
            - oneOf:
                - type: string
                - type: array
                  items:
                    type: string
              description: >-
                Email address or array of up to 50 addresses.
            - type: 'null'
          description: >-
            Reply-to address or array of up to 50 addresses.
        html:
          anyOf:
            - type: string
            - type: 'null'
          description: >-
            HTML content, sharing a 900000-byte UTF-8 limit with text and headers; provide HTML or
            text unless using a template.
        text:
          anyOf:
            - type: string
            - type: 'null'
          description: >-
            Plain text content, sharing a 900000-byte UTF-8 limit with HTML and headers; provide
            text or HTML unless using a template.
        headers:
          anyOf:
            - type: object
              additionalProperties:
                type: string
            - type: 'null'
          description: >-
            Up to 50 custom headers, counted toward the combined 900000-byte content limit.
        scheduled_at:
          anyOf:
            - type: string
              description: >-
                Send time in ISO 8601 or natural language, up to 30 days ahead, using UTC when
                unzoned; past times send immediately and rescheduling requires a future time.
            - type: 'null'
          description: >-
            Send time in ISO 8601 or natural language, up to 30 days ahead, using UTC when unzoned
            and sending immediately for past times.
        attachments:
          anyOf:
            - type: array
              items:
                $ref: '#/components/schemas/Attachment'
            - type: 'null'
          description: >-
            Attachments with a combined encoded size of at most 40 MiB, within the 42 MiB JSON
            request limit and your installation’s proxy limits.
        tags:
          anyOf:
            - type: array
              items:
                $ref: '#/components/schemas/Tag'
              maxItems: 48
            - type: 'null'
          description: >-
            Up to 48 tags to associate with the email.
        template:
          anyOf:
            - $ref: '#/components/schemas/EmailTemplateInput'
            - type: 'null'
          description: >-
            Published template to render instead of HTML or text; non-null html or text cannot be
            combined with a template.
        topic_id:
          type:
            - string
            - 'null'
          description: >-
            Topic ID used to check each recipient’s subscription before delivery; explicit choices
            override defaults and unsubscribed recipients fail.
      description: >-
        An SMTP email with at least one recipient across to, cc, and bcc; to may be omitted.
      allOf:
        - anyOf:
            - required:
                - template
              properties:
                template:
                  $ref: '#/components/schemas/EmailTemplateInput'
            - required:
                - from
                - subject
              properties:
                from:
                  type: string
                  minLength: 1
                subject:
                  type: string
                  minLength: 1
        - anyOf:
            - required:
                - template
              properties:
                template:
                  $ref: '#/components/schemas/EmailTemplateInput'
                html:
                  type: 'null'
                text:
                  type: 'null'
            - required:
                - html
              properties:
                html:
                  type: string
                  minLength: 1
                template:
                  type: 'null'
            - required:
                - text
              properties:
                text:
                  type: string
                  minLength: 1
                template:
                  type: 'null'
