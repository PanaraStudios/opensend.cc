---
openapi: 3.1.0
info:
  title: Opensend API
  version: 1.0.0
  description: >-
    REST contract audited at 0b10d8d. Adapted from Resend OpenAPI (MIT; LICENSE-resend). Self-hosted Convex
    site origin, not dashboard origin. Opaque Convex ids replace UUIDs. Resource creates return 201; email
    sends return 200, event send 202. All REST routes share POST idempotency, team-wide 10 requests/s, bounded
    id cursors with id tie-breaks (limit 20, max 100), no CORS. Default request limit 1 MiB; POST /emails and
    /smtp/emails permit 42 MiB JSON subject to deployment proxy limits. Error bodies use
    statusCode/name/message. Validation descriptions also specify constraints requiring backend state or byte
    counting; JSON Schema alone cannot express all validation. See docs/resend-parity.md and docs/rest-api.md.
  license:
    name: Apache-2.0; Resend-derived portions MIT
    url: https://github.com/resend/resend-openapi/blob/main/LICENSE
servers:
  - url: '{apiOrigin}'
    description: This installation’s Convex HTTP action/site origin, without a trailing slash.
    variables:
      apiOrigin:
        default: http://localhost:3211
security:
  - bearerAuth: []
tags:
  - name: API Keys
  - name: Broadcasts
  - name: Contact Properties
  - name: Contacts
  - name: Domains
  - name: Emails
  - name: Events
  - name: Logs
  - name: OAuth
  - name: Receiving Emails
  - name: SMTP
  - name: Segments
  - name: Templates
  - name: Topics
  - name: Webhooks
  - name: Suppressions
x-opensend-base-commit: 0b10d8d
x-resend-source-sha256: 1bc22334de302c1bddec319da1abe1d640fc5bdb626eb0cde81bc0b67fb2d4f7
paths:
  /emails:
    post:
      operationId: emails/send
      tags:
        - Emails
      summary: Send an email
      description: >-
        Requires a nonempty to and a sender/subject from explicit fields or a published template, plus
        html/text or template. Template cannot accompany non-null html/text. Combined to/cc/bcc cap 50; 50
        headers, 48 tags, 900000 UTF-8 bytes of HTML/text/headers. At most 40 MiB encoded attachments. Unknown
        JSON fields are ignored, including react; render react in the SDK. Verified sender, SES
        tenant/configuration set and current IAM policy required. Suppressed recipients are removed before
        submission; no automatic unsubscribe headers. See docs/rest-api.md for SES restrictions. Requires
        sending credentials. Unknown query/body fields are ignored unless documented otherwise.
      x-opensend-permission: sending
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendEmailRequest'
      responses:
        '200':
          description: OK
          headers:
            ratelimit-limit:
              $ref: '#/components/headers/ratelimit_limit'
            ratelimit-remaining:
              $ref: '#/components/headers/ratelimit_remaining'
            ratelimit-reset:
              $ref: '#/components/headers/ratelimit_reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendEmailResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
    get:
      operationId: emails/list
      tags:
        - Emails
      summary: Retrieve a list of emails
      description: >-
        Lists metadata only, no object marker or bodies in items. Missing cc/bcc/reply_to may be null;
        message_id and scheduled_at may be null. Emails retained 30 days after terminal send/failure; pending
        work protected. Requires full_access credentials. Unknown query/body fields are ignored unless
        documented otherwise.
      x-opensend-permission: full_access
      parameters:
        - $ref: '#/components/parameters/PaginationLimit'
        - $ref: '#/components/parameters/PaginationAfter'
        - $ref: '#/components/parameters/PaginationBefore'
      responses:
        '200':
          description: OK
          headers:
            ratelimit-limit:
              $ref: '#/components/headers/ratelimit_limit'
            ratelimit-remaining:
              $ref: '#/components/headers/ratelimit_remaining'
            ratelimit-reset:
              $ref: '#/components/headers/ratelimit_reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEmailsResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
  /emails/batch:
    post:
      operationId: emails/send-batch
      tags:
        - Emails
      summary: Trigger up to 100 batch emails at once.
      description: >-
        Same validation as SendEmailRequest; attachments unsupported. Strict mode rolls the whole batch back.
        Permissive mode returns successful ids and indexed errors. Total JSON limit 1 MiB.
      x-opensend-permission: sending
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: x-batch-validation
          in: header
          schema:
            type: string
            enum:
              - strict
              - permissive
            default: strict
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/BatchEmailRequest'
              minItems: 1
              maxItems: 100
      responses:
        '200':
          description: OK
          headers:
            ratelimit-limit:
              $ref: '#/components/headers/ratelimit_limit'
            ratelimit-remaining:
              $ref: '#/components/headers/ratelimit_remaining'
            ratelimit-reset:
              $ref: '#/components/headers/ratelimit_reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBatchEmailsResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
  /emails/{id}:
    get:
      operationId: emails/get
      tags:
        - Emails
      summary: Retrieve a single email
      description: >-
        Includes scheduled_at and tags; missing content/message_id are null. Address lists default to empty
        arrays. Requires full_access credentials. Unknown query/body fields are ignored unless documented
        otherwise.
      x-opensend-permission: full_access
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Opaque resource id.
      responses:
        '200':
          description: OK
          headers:
            ratelimit-limit:
              $ref: '#/components/headers/ratelimit_limit'
            ratelimit-remaining:
              $ref: '#/components/headers/ratelimit_remaining'
            ratelimit-reset:
              $ref: '#/components/headers/ratelimit_reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Email'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
    patch:
      operationId: emails/update
      tags:
        - Emails
      summary: Update a single email
      description: >-
        Only scheduled email still awaiting release can change; queue race loses with 422. Response is
        object/id, not updated schedule. Requires full_access credentials. Unknown query/body fields are
        ignored unless documented otherwise.
      x-opensend-permission: full_access
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Opaque resource id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmailOptions'
      responses:
        '200':
          description: OK
          headers:
            ratelimit-limit:
              $ref: '#/components/headers/ratelimit_limit'
            ratelimit-remaining:
              $ref: '#/components/headers/ratelimit_remaining'
            ratelimit-reset:
              $ref: '#/components/headers/ratelimit_reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateEmailResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
  /emails/{id}/cancel:
    post:
      operationId: emails/cancel
      tags:
        - Emails
      summary: Cancel the schedule of the e-mail.
      description: >-
        Only scheduled email still awaiting release can cancel; queue race loses with 422. Returns object/id
        only. Requires full_access credentials. Unknown query/body fields are ignored unless documented
        otherwise.
      x-opensend-permission: full_access
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Opaque resource id.
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          headers:
            ratelimit-limit:
              $ref: '#/components/headers/ratelimit_limit'
            ratelimit-remaining:
              $ref: '#/components/headers/ratelimit_remaining'
            ratelimit-reset:
              $ref: '#/components/headers/ratelimit_reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelEmailResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
  /domains:
    post:
      operationId: domains/create
      tags:
        - Domains
      summary: Create a new domain
      description: >-
        Region defaults to installation region (fallback us-east-1). TLS and sending/receiving capabilities
        are accepted at creation. Receiving requires a supported SES region. Tracking CNAME verification
        activates tracking; subdomain cannot later be removed. Tracking uses HTTP; HTTPS needs
        operator-provided CDN/certificate. Provisioning is asynchronous.
      x-opensend-permission: full_access
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDomainRequest'
      responses:
        '201':
          description: OK
          headers:
            ratelimit-limit:
              $ref: '#/components/headers/ratelimit_limit'
            ratelimit-remaining:
              $ref: '#/components/headers/ratelimit_remaining'
            ratelimit-reset:
              $ref: '#/components/headers/ratelimit_reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDomainResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
    get:
      operationId: domains/list
      tags:
        - Domains
      summary: Retrieve a list of domains
      description: >-
        Requires full_access credentials. Unknown query/body fields are ignored unless documented otherwise.
        Domain statuses omit not_started/partially_failed; DNS records include DMARC but no TrackingCAA/CAA.
        Creation and retrieval return tls; lists may return tracking_subdomain.
      x-opensend-permission: full_access
      parameters:
        - $ref: '#/components/parameters/PaginationLimit'
        - $ref: '#/components/parameters/PaginationAfter'
        - $ref: '#/components/parameters/PaginationBefore'
      responses:
        '200':
          description: OK
          headers:
            ratelimit-limit:
              $ref: '#/components/headers/ratelimit_limit'
            ratelimit-remaining:
              $ref: '#/components/headers/ratelimit_remaining'
            ratelimit-reset:
              $ref: '#/components/headers/ratelimit_reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDomainsResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
  /domains/{id}:
    get:
      operationId: domains/get
      tags:
        - Domains
      summary: Retrieve a single domain
      description: >-
        Requires full_access credentials. Unknown query/body fields are ignored unless documented otherwise.
        Domain statuses omit not_started/partially_failed; DNS records include DMARC but no TrackingCAA/CAA.
        Creation and retrieval return tls; lists may return tracking_subdomain.
