            - enabled
            - disabled
          default: disabled
          description: >-
            Initial automation status, defaulting to disabled.
        steps:
          type: array
          minItems: 1
          maxItems: 101
          description: >-
            One trigger plus up to 100 execution steps, with a 64 KiB definition limit and maximum
            nesting depth of 12.
          items:
            $ref: '#/components/schemas/AutomationStep'
        connections:
          type: array
          description: >-
            Workflow connections forming a tree, without cycles, joins, or arbitrary fan-out.
          items:
            $ref: '#/components/schemas/AutomationConnection'
    AutomationStep:
      type: object
      description: A step in an automation workflow. The `config` object varies based on the step `type`.
      required:
        - key
        - type
        - config
      properties:
        key:
          type: string
          description: A unique key for this step within the automation graph.
        type:
          type: string
          enum:
            - trigger
            - send_email
            - delay
            - wait_for_event
            - condition
            - contact_update
            - contact_delete
            - add_to_segment
          description: >-
            Step type determining the required configuration: trigger, send_email, delay,
            wait_for_event, condition, contact_update, contact_delete, or add_to_segment.
        config:
          type: object
          description: >-
            Step-specific settings such as event_name, template, duration, condition rules, contact
            fields, or segment_id; subject overrides, structured template variables, mixed nested
            conditions, null comparisons, and wait filter_rule return 422, and waits need a timeout
            of at most 30 days to activate.
    AutomationConnection:
      type: object
      description: A connection between two steps in the automation graph.
      required:
        - from
        - to
      properties:
        from:
          type: string
          description: The `key` of the source step.
        to:
          type: string
          description: The `key` of the target step.
        type:
          type: string
          enum:
            - default
            - condition_met
            - condition_not_met
            - timeout
            - event_received
          default: default
          description: >-
            Connection type, defaulting to default.
    CreateAutomationResponse:
      type: object
      properties:
        object:
          type: string
          description: Type of the response object.
          example: automation
        id:
          type: string
          description: The ID of the created automation.
      required:
        - object
        - id
      additionalProperties: false
    ListAutomationsResponse:
      type: object
      properties:
        object:
          type: string
          description: Type of the response object.
          example: list
        has_more:
          type: boolean
          description: Indicates if there are more results available.
        data:
          type: array
          description: Array of automations.
          items:
            $ref: '#/components/schemas/AutomationListItem'
      required:
        - object
        - has_more
        - data
      additionalProperties: false
    AutomationListItem:
      type: object
