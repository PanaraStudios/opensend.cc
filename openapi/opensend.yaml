      parameters:
        - name: start_date
          in: query
          schema:
            type: string
          description: >-
            ISO 8601 start date or datetime, no later than end_date, defaulting to six days before
            end_date.
        - name: end_date
          in: query
          schema:
            type: string
          description: >-
            ISO 8601 end date or datetime, defaulting to now and clamped to now for future values.
        - name: timezone
          in: query
          schema:
            type: string
            default: UTC
          description: >-
