---
openapi: 3.1.0
info:
  title: Opensend API
  version: 1.0.0
  description: >-
    The Resend-compatible REST API for your self-hosted Opensend installation is available at your Opensend API origin and uses bearer API keys (`os_…`) scoped to your team; CORS is unavailable and unknown fields are ignored unless stated otherwise.
    Errors return `statusCode`, `name`, and `message`; requests default to a 1 MiB body limit unless stated otherwise.
    Rate limits allow 10 requests per second per team, with rate-limit headers and `retry-after` on 429 responses.
    POST requests support 24-hour idempotency with `Idempotency-Key`.
    Lists use ID cursors with a default page size of 20 and a maximum of 100; [See Compatibility with Resend](/docs/api-reference/compatibility).
  license:
    name: Apache-2.0; Resend-derived portions MIT
    url: https://github.com/resend/resend-openapi/blob/main/LICENSE
servers:
  - url: '{apiOrigin}'
    description: Your Opensend API origin, without a trailing slash.
    variables:
      apiOrigin:
        default: http://localhost:3211
security:
  - bearerAuth: []
tags:
  - name: API Keys
  - name: Broadcasts
  - name: Contact Properties
  - name: Contacts
  - name: Domains
  - name: Emails
  - name: Events
  - name: Logs
  - name: OAuth
  - name: Receiving Emails
  - name: SMTP
  - name: Segments
  - name: Templates
  - name: Topics
  - name: Webhooks
  - name: Suppressions
x-opensend-base-commit: 0b10d8d
x-resend-source-sha256: 1bc22334de302c1bddec319da1abe1d640fc5bdb626eb0cde81bc0b67fb2d4f7
