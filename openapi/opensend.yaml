      summary: Send Email
      description: >-
        Send an email from a verified sender (requires sending or full access). Suppressed
        recipients are excluded, and unsubscribe headers are not added automatically.
      x-opensend-permission: sending
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendEmailRequest'
      responses:
        '200':
          description: The result of the successful request.
          headers:
            ratelimit-limit:
              $ref: '#/components/headers/ratelimit_limit'
            ratelimit-remaining:
              $ref: '#/components/headers/ratelimit_remaining'
            ratelimit-reset:
              $ref: '#/components/headers/ratelimit_reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendEmailResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
    get:
      operationId: emails/list
      tags:
        - Emails
      summary: List Emails
      description: >-
        List email metadata without message bodies (requires full access). Emails are kept for 30
        days after sending or failure; pending emails remain available.
      x-opensend-permission: full_access
      parameters:
        - $ref: '#/components/parameters/PaginationLimit'
        - $ref: '#/components/parameters/PaginationAfter'
        - $ref: '#/components/parameters/PaginationBefore'
      responses:
        '200':
          description: The requested resource list.
          headers:
            ratelimit-limit:
