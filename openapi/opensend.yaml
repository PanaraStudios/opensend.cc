        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
    patch:
      operationId: domains/update
      tags:
        - Domains
      summary: Update an existing domain
      description: >-
        Requires provisioned domain. Receiving only in SES receiving regions. Tracking subdomain can change
        but cannot be removed. Omitted or null scalar settings are unchanged. Requires full_access
        credentials. Unknown query/body fields are ignored unless documented otherwise. Domain statuses omit
        not_started/partially_failed; DNS records include DMARC but no TrackingCAA/CAA. Creation and retrieval
        return tls; lists may return tracking_subdomain.
      x-opensend-permission: full_access
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Opaque resource id.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDomainOptions'
      responses:
        '200':
          description: OK
          headers:
            ratelimit-limit:
              $ref: '#/components/headers/ratelimit_limit'
            ratelimit-remaining:
              $ref: '#/components/headers/ratelimit_remaining'
            ratelimit-reset:
              $ref: '#/components/headers/ratelimit_reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateDomainResponseSuccess'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
    delete:
      operationId: domains/remove
      tags:
        - Domains
      summary: Remove an existing domain
      description: >-
        Removal and related cleanup may continue asynchronously. Requires full_access credentials. Unknown
        query/body fields are ignored unless documented otherwise. Domain statuses omit
        not_started/partially_failed; DNS records include DMARC but no TrackingCAA/CAA. Creation and retrieval
        return tls; lists may return tracking_subdomain.
      x-opensend-permission: full_access
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Opaque resource id.
      responses:
        '200':
          description: OK
          headers:
            ratelimit-limit:
              $ref: '#/components/headers/ratelimit_limit'
            ratelimit-remaining:
              $ref: '#/components/headers/ratelimit_remaining'
            ratelimit-reset:
              $ref: '#/components/headers/ratelimit_reset'
          content:
            application/json:
              schema:
