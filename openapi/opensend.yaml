            `dimensions`.
        - name: granularity
          in: query
          schema:
            type: string
            enum:
              - hourly
              - daily
              - weekly
              - monthly
            default: daily
          description: >-
            Period size for the period dimension, limited to 10000 periods in a date range.
        - name: metrics
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - received
                - delivered
                - complained
                - suppressed
                - bounced
                - bounced_transient
                - bounced_permanent
                - bounced_undetermined
                - opened
                - clicked
                - unsubscribed
                - delivery_delayed
                - failed
                - sent
                - unique_opened
                - unique_clicked
                - delivery_rate
                - open_rate
                - click_rate
                - bounce_rate
                - complaint_rate
                - unsubscribe_rate
          description: >-
            Comma-separated or repeated metric names, defaulting to the 18 supported metrics;
            opened, clicked, unsubscribed, and unsubscribe_rate return 422.
        - name: dimensions
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - period
                - domain
                - email
                - broadcast
          description: >-
            Comma-separated or repeated period and domain dimensions; email and broadcast return
            422, and omission returns only totals without data.
        - name: domain_id
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
          description: >-
