          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
  /broadcasts/{id}/clicked-links:
    get:
      operationId: broadcasts/list-clicked-links
      tags:
        - Broadcasts
      summary: List Broadcast Clicked Links
      description: >-
        List broadcast links ranked by total clicks, highest first (requires full access). Unique
        clicks count distinct recipient messages, and completed reports are kept for 30 days.
      x-opensend-permission: full_access
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/PaginationLimit'
        - $ref: '#/components/parameters/PaginationAfter'
        - $ref: '#/components/parameters/PaginationBefore'
      responses:
        '200':
          description: The requested resource list.
          headers:
            ratelimit-limit:
              $ref: '#/components/headers/ratelimit_limit'
            ratelimit-remaining:
              $ref: '#/components/headers/ratelimit_remaining'
            ratelimit-reset:
              $ref: '#/components/headers/ratelimit_reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBroadcastClickedLinksResponseSuccess'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
components:
  headers:
    ratelimit_limit:
      description: 'Team requests/second limit: 10.'
      schema:
        type: string
    ratelimit_remaining:
      description: Requests remaining in the team window.
      schema:
        type: string
    ratelimit_reset:
      description: Seconds until the current rate window resets.
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: os_ API key or OAuth access token
      description: >-
        Full-access keys / full_access OAuth required except sends also accept sending_access / emails:send.
        All credentials scoped to one team. SMTP rejects OAuth.
    oauthBearer:
      type: http
      scheme: bearer
      bearerFormat: OAuth access token
      description: OAuth bearer tokens with full_access, accepted alongside full-access API keys by REST routes.
  parameters:
    PaginationLimit:
      name: limit
      in: query
      description: >-
        Number of results, from 1 to 100, defaulting to 20 even when omitted.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    PaginationAfter:
      name: after
      in: query
      description: >-
        Resource ID for the next page, exclusive with before; an unknown or inaccessible cursor
        returns 422.
      schema:
        type: string
    PaginationBefore:
      name: before
      in: query
      description: >-
        Resource ID for the previous page, exclusive with after, with results still newest first; an
        unknown or inaccessible cursor returns 422.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: >-
        Unique key of 1–256 characters for 24-hour POST retries within your team; reuse the same
        method, path, and exact body to avoid 409 conflicts, and retry server failures with the same
        key.
      schema:
        type: string
        minLength: 1
        maxLength: 256
  responses:
    Error400:
      description: >-
        Invalid JSON or idempotency key (validation_error or invalid_idempotency_key).
      headers:
        ratelimit-limit:
          $ref: '#/components/headers/ratelimit_limit'
        ratelimit-remaining:
          $ref: '#/components/headers/ratelimit_remaining'
        ratelimit-reset:
          $ref: '#/components/headers/ratelimit_reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error400'
    Error401:
      description: >-
        Missing or restricted API key (missing_api_key or restricted_api_key). Rate-limit headers
        may be absent.
      headers:
        ratelimit-limit:
          $ref: '#/components/headers/ratelimit_limit'
        ratelimit-remaining:
          $ref: '#/components/headers/ratelimit_remaining'
        ratelimit-reset:
          $ref: '#/components/headers/ratelimit_reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error401'
    Error403:
      description: >-
        Invalid credentials or insufficient permission (invalid_api_key, invalid_permission, or
        validation_error). Rate-limit headers may be absent.
      headers:
        ratelimit-limit:
          $ref: '#/components/headers/ratelimit_limit'
        ratelimit-remaining:
          $ref: '#/components/headers/ratelimit_remaining'
        ratelimit-reset:
          $ref: '#/components/headers/ratelimit_reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error403'
    Error404:
      description: >-
        Resource not found or inaccessible to your team (not_found).
      headers:
        ratelimit-limit:
          $ref: '#/components/headers/ratelimit_limit'
        ratelimit-remaining:
          $ref: '#/components/headers/ratelimit_remaining'
        ratelimit-reset:
          $ref: '#/components/headers/ratelimit_reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error404'
    Error409:
      description: >-
        Idempotency key reused for a different request or a request still in progress
        (invalid_idempotent_request or concurrent_idempotent_requests).
      headers:
        ratelimit-limit:
          $ref: '#/components/headers/ratelimit_limit'
        ratelimit-remaining:
          $ref: '#/components/headers/ratelimit_remaining'
        ratelimit-reset:
          $ref: '#/components/headers/ratelimit_reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error409'
    Error413:
      description: >-
        Request exceeds the body size limit (validation_error). Rate-limit headers may be absent.
      headers:
        ratelimit-limit:
          $ref: '#/components/headers/ratelimit_limit'
        ratelimit-remaining:
          $ref: '#/components/headers/ratelimit_remaining'
        ratelimit-reset:
          $ref: '#/components/headers/ratelimit_reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error413'
    Error422:
      description: >-
        Invalid or missing input, or an invalid attachment (validation_error,
        missing_required_field, or invalid_attachment).
      headers:
        ratelimit-limit:
          $ref: '#/components/headers/ratelimit_limit'
        ratelimit-remaining:
          $ref: '#/components/headers/ratelimit_remaining'
        ratelimit-reset:
          $ref: '#/components/headers/ratelimit_reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error422'
    Error429:
      description: >-
        Team request limit exceeded (rate_limit_exceeded); wait for retry-after before retrying.
      headers:
        ratelimit-limit:
          $ref: '#/components/headers/ratelimit_limit'
        ratelimit-remaining:
          $ref: '#/components/headers/ratelimit_remaining'
        ratelimit-reset:
          $ref: '#/components/headers/ratelimit_reset'
        retry-after:
          description: Seconds until retry.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error429'
    Error500:
      description: >-
        Unexpected server error (application_error); the idempotency key is available for retry.
      headers:
        ratelimit-limit:
          $ref: '#/components/headers/ratelimit_limit'
        ratelimit-remaining:
          $ref: '#/components/headers/ratelimit_remaining'
        ratelimit-reset:
          $ref: '#/components/headers/ratelimit_reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error500'
  schemas:
    DomainCapabilities:
      type: object
      properties:
        sending:
          anyOf:
            - type: string
              enum:
                - enabled
                - disabled
            - type: 'null'
          description: Enable or disable sending emails from this domain.
        receiving:
          anyOf:
            - type: string
              enum:
                - enabled
                - disabled
            - type: 'null'
          description: Enable or disable receiving emails to this domain.
      description: >-
        Choose sending and receiving capabilities with at least one enabled.
    Tag:
      type: object
      properties:
        name:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,256}$
          description: >-
            Tag name of 1–256 ASCII letters, numbers, underscores, or hyphens.
        value:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,256}$
          description: >-
            Tag value of 1–256 ASCII letters, numbers, underscores, or hyphens.
      required:
        - name
        - value
    Attachment:
      type: object
      properties:
        content:
          type: string
          description: >-
            Base64 file content with whitespace ignored, limited to 40 MiB of encoded content across
            all attachments.
        filename:
          type: string
          minLength: 1
          maxLength: 255
          description: >-
            Attachment filename, inferred from the URL path when omitted.
        path:
          type: string
          format: uri
          description: >-
            Public HTTPS URL with up to three redirects to public HTTPS destinations; private
            addresses are rejected.
        content_type:
          anyOf:
            - type: string
              pattern: ^[A-Za-z0-9!#$&^_.+-]+/[A-Za-z0-9!#$&^_.+-]+$
            - type: 'null'
          description: >-
            Attachment MIME type, inferred from the filename when omitted.
        content_id:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 78
            - type: 'null'
          description: Content ID for embedding inline images using cid references (e.g., cid:image001).
      required: []
      allOf:
        - anyOf:
            - required:
                - path
            - required:
                - content
                - filename
      description: >-
        Attach base64 content or a public HTTPS file; a filename can be inferred from the URL.
    EmailTemplateInput:
      type: object
      properties:
        id:
          type: string
          description: Published template id or alias.
        variables:
          anyOf:
            - type: object
              additionalProperties:
                type:
                  - string
                  - number
            - type: 'null'
          description: >-
            Template variable values, each a string or number matching the variable’s definition.
      required:
        - id
    SendEmailRequest:
      type: object
      properties:
        from:
          anyOf:
            - type: string
            - type: 'null'
          description: >-
            Verified sender address, optionally formatted as Name <sender@example.com>, or omitted
            when supplied by a published template.
        to:
          oneOf:
            - type: string
              minLength: 1
            - type: array
              items:
                type: string
              minItems: 1
              maxItems: 50
          description: >-
            Recipient address or array of addresses, with up to 50 recipients across to, cc, and
            bcc.
        subject:
          anyOf:
            - type: string
            - type: 'null'
          description: >-
            Email subject, required unless supplied by a published template.
        cc:
          anyOf:
            - oneOf:
                - type: string
                - type: array
                  items:
                    type: string
              description: >-
                Email address or array of up to 50 addresses.
            - type: 'null'
          description: >-
            Cc address or array of addresses, counted toward the 50-recipient total.
        bcc:
          anyOf:
            - oneOf:
                - type: string
                - type: array
                  items:
                    type: string
              description: >-
                Email address or array of up to 50 addresses.
            - type: 'null'
          description: >-
            Bcc address or array of addresses, counted toward the 50-recipient total.
        reply_to:
          anyOf:
            - oneOf:
                - type: string
                - type: array
                  items:
                    type: string
              description: >-
                Email address or array of up to 50 addresses.
            - type: 'null'
          description: >-
            Reply-to address or array of up to 50 addresses.
        html:
          anyOf:
            - type: string
            - type: 'null'
          description: >-
            HTML content, sharing a 900000-byte UTF-8 limit with text and headers; provide HTML or
            text unless using a template.
        text:
          anyOf:
            - type: string
            - type: 'null'
          description: >-
            Plain text content, sharing a 900000-byte UTF-8 limit with HTML and headers; provide
            text or HTML unless using a template.
        headers:
          anyOf:
            - type: object
              additionalProperties:
                type: string
            - type: 'null'
          description: >-
            Up to 50 custom headers, counted toward the combined 900000-byte content limit.
        scheduled_at:
          anyOf:
            - type: string
              description: >-
                Send time in ISO 8601 or natural language, up to 30 days ahead, using UTC when
                unzoned; past times send immediately and rescheduling requires a future time.
            - type: 'null'
          description: >-
            Send time in ISO 8601 or natural language, up to 30 days ahead, using UTC when unzoned
            and sending immediately for past times.
        attachments:
          anyOf:
            - type: array
              items:
                $ref: '#/components/schemas/Attachment'
            - type: 'null'
          description: >-
            Attachments with a combined encoded size of at most 40 MiB, within the 42 MiB JSON
            request limit and your installation’s proxy limits.
        tags:
          anyOf:
            - type: array
              items:
                $ref: '#/components/schemas/Tag'
              maxItems: 48
            - type: 'null'
          description: >-
            Up to 48 tags to associate with the email.
        template:
          anyOf:
            - $ref: '#/components/schemas/EmailTemplateInput'
            - type: 'null'
          description: >-
            Published template to render instead of HTML or text; non-null html or text cannot be
            combined with a template.
        topic_id:
          type:
            - string
            - 'null'
          description: >-
            Topic ID used to check each recipient’s subscription before delivery; explicit choices
            override defaults and unsubscribed recipients fail.
      required:
        - to
      description: >-
        Send email content directly or use a published template; render React email content in your
        SDK before sending.
      allOf:
        - anyOf:
            - required:
                - template
              properties:
                template:
                  $ref: '#/components/schemas/EmailTemplateInput'
            - required:
                - from
                - subject
              properties:
                from:
                  type: string
                  minLength: 1
                subject:
                  type: string
                  minLength: 1
        - anyOf:
            - required:
                - template
              properties:
                template:
                  $ref: '#/components/schemas/EmailTemplateInput'
                html:
                  type: 'null'
                text:
                  type: 'null'
            - required:
                - html
              properties:
                html:
                  type: string
                  minLength: 1
                template:
                  type: 'null'
            - required:
                - text
              properties:
                text:
                  type: string
                  minLength: 1
                template:
                  type: 'null'
    BatchEmailRequest:
      type: object
      properties:
        from:
          anyOf:
            - type: string
            - type: 'null'
          description: >-
            Verified sender address, optionally formatted as Name <sender@example.com>, or omitted
            when supplied by a published template.
        to:
          oneOf:
            - type: string
              minLength: 1
            - type: array
              items:
                type: string
              minItems: 1
              maxItems: 50
          description: >-
            Recipient address or array of addresses, with up to 50 recipients across to, cc, and
            bcc.
        subject:
          anyOf:
            - type: string
            - type: 'null'
          description: >-
            Email subject, required unless supplied by a published template.
        cc:
          anyOf:
            - oneOf:
                - type: string
                - type: array
                  items:
                    type: string
            - type: 'null'
          description: >-
            Cc address or array of addresses, counted toward the 50-recipient total.
        bcc:
          anyOf:
            - oneOf:
                - type: string
                - type: array
                  items:
                    type: string
            - type: 'null'
          description: >-
            Bcc address or array of addresses, counted toward the 50-recipient total.
        reply_to:
          anyOf:
            - oneOf:
                - type: string
                - type: array
                  items:
                    type: string
            - type: 'null'
          description: >-
            Reply-to address or array of up to 50 addresses.
        html:
          anyOf:
            - type: string
            - type: 'null'
          description: >-
            HTML content, sharing a 900000-byte UTF-8 limit with text and headers; provide HTML or
            text unless using a template.
        text:
          anyOf:
            - type: string
            - type: 'null'
          description: >-
            Plain text content, sharing a 900000-byte UTF-8 limit with HTML and headers; provide
            text or HTML unless using a template.
        headers:
          anyOf:
            - type: object
              additionalProperties:
                type: string
            - type: 'null'
          description: >-
            Up to 50 custom headers, counted toward the combined 900000-byte content limit.
        scheduled_at:
          anyOf:
            - type: string
              description: >-
                Send time in ISO 8601 or natural language, up to 30 days ahead, using UTC when
                unzoned; past times send immediately and rescheduling requires a future time.
            - type: 'null'
          description: >-
            Send time in ISO 8601 or natural language, up to 30 days ahead, using UTC when unzoned
            and sending immediately for past times.
        attachments:
          anyOf:
            - type: array
              items:
                $ref: '#/components/schemas/Attachment'
              maxItems: 0
            - type: 'null'
        tags:
          anyOf:
            - type: array
              items:
                $ref: '#/components/schemas/Tag'
              maxItems: 48
            - type: 'null'
          description: >-
            Up to 48 tags to associate with the email.
        template:
          anyOf:
            - $ref: '#/components/schemas/EmailTemplateInput'
            - type: 'null'
          description: >-
            Published template to render instead of HTML or text; non-null html or text cannot be
            combined with a template.
        topic_id:
          type:
            - string
            - 'null'
          description: >-
            Topic ID used to check each recipient’s subscription before delivery; explicit choices
            override defaults and unsubscribed recipients fail.
      required:
        - to
      description: >-
        An email in a batch, with the same content limits as a single email and no attachments.
      allOf:
        - anyOf:
            - required:
                - template
              properties:
                template:
                  $ref: '#/components/schemas/EmailTemplateInput'
            - required:
                - from
                - subject
              properties:
                from:
                  type: string
                  minLength: 1
                subject:
                  type: string
                  minLength: 1
        - anyOf:
            - required:
                - template
              properties:
                template:
                  $ref: '#/components/schemas/EmailTemplateInput'
                html:
                  type: 'null'
                text:
                  type: 'null'
            - required:
                - html
              properties:
                html:
                  type: string
                  minLength: 1
                template:
                  type: 'null'
            - required:
                - text
              properties:
                text:
                  type: string
                  minLength: 1
                template:
                  type: 'null'
    SendEmailResponse:
      type: object
      properties:
        id:
          type: string
          description: The ID of the sent email.
      required:
        - id
      additionalProperties: false
    EmailListItem:
      type: object
      properties:
        id:
          type: string
          description: The opaque resource ID returned by Opensend; IDs are not UUIDs.
        message_id:
          anyOf:
            - type: string
            - type: 'null'
        to:
          type: array
          items:
            type: string
        from:
          type: string
        created_at:
          type: string
          description: UTC PostgreSQL-style timestamp, e.g. 2026-09-29 12:00:00.000000+00.
        subject:
          type: string
        bcc:
          anyOf:
            - type: array
              items:
                type: string
            - type: 'null'
          description: >-
            Bcc addresses, or null when absent.
        cc:
          anyOf:
            - type: array
              items:
                type: string
            - type: 'null'
          description: >-
            Cc addresses, or null when absent.
        reply_to:
          anyOf:
            - type: array
              items:
                type: string
            - type: 'null'
          description: >-
            Reply-to addresses, or null when absent.
        last_event:
          type: string
          enum:
            - queued
            - scheduled
            - sent
            - delivered
            - delivery_delayed
            - opened
            - clicked
            - bounced
            - complained
            - failed
            - canceled
            - suppressed
        scheduled_at:
          anyOf:
            - type: string
              description: UTC PostgreSQL-style timestamp, e.g. 2026-09-29 12:00:00.000000+00.
            - type: 'null'
      required:
        - id
        - message_id
        - to
        - from
        - created_at
        - subject
        - bcc
        - cc
        - reply_to
        - last_event
        - scheduled_at
      additionalProperties: false
    Email:
      type: object
      properties:
        id:
          type: string
          description: The opaque resource ID returned by Opensend; IDs are not UUIDs.
        message_id:
          anyOf:
            - type: string
            - type: 'null'
          description: The Message-ID header value of the email.
        to:
          type: array
          items:
            type: string
          description: >-
            Recipient email addresses.
        from:
          type: string
          description: The email address of the sender.
        created_at:
          type: string
          description: UTC PostgreSQL-style timestamp, e.g. 2026-09-29 12:00:00.000000+00.
        subject:
          type: string
          description: The subject line of the email.
        bcc:
          type: array
          items:
            type: string
          description: The email addresses of the blind carbon copy recipients.
        cc:
          type: array
          items:
            type: string
          description: >-
            Cc recipient email addresses.
        reply_to:
          type: array
          items:
            type: string
          description: >-
            Reply-to email addresses.
        last_event:
          type: string
          enum:
