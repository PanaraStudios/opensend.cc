  /emails/batch:
    post:
      operationId: emails/send-batch
      tags:
        - Emails
      summary: Send Batch Emails
      description: >-
        Send up to 100 emails in one request, without attachments (requires sending or full access).
        Requests are limited to 1 MiB; strict validation rejects the whole batch, while permissive
        validation returns successful IDs and errors by input index.
      x-opensend-permission: sending
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: x-batch-validation
          in: header
          schema:
            type: string
            enum:
              - strict
              - permissive
            default: strict
          description: >-
            Validation mode: strict rejects the entire batch on error, while permissive returns
            successful IDs and indexed errors.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/BatchEmailRequest'
              minItems: 1
              maxItems: 100
      responses:
        '200':
          description: The result of the successful request.
          headers:
            ratelimit-limit:
              $ref: '#/components/headers/ratelimit_limit'
            ratelimit-remaining:
              $ref: '#/components/headers/ratelimit_remaining'
            ratelimit-reset:
              $ref: '#/components/headers/ratelimit_reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBatchEmailsResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
