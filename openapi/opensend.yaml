            - scheduled
            - sent
            - delivered
            - delivery_delayed
            - opened
            - clicked
            - bounced
            - complained
            - failed
            - canceled
            - suppressed
          description: The status of the email.
        scheduled_at:
          anyOf:
            - type: string
              description: UTC PostgreSQL-style timestamp, e.g. 2026-09-29 12:00:00.000000+00.
            - type: 'null'
        object:
          type: string
          enum:
            - email
          description: The type of object.
        html:
          anyOf:
            - type: string
            - type: 'null'
          description: >-
            HTML content, or null when unavailable.
        text:
