        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
components:
  headers:
    ratelimit_limit:
      description: 'Team requests/second limit: 10.'
      schema:
        type: string
    ratelimit_remaining:
      description: Requests remaining in the team window.
      schema:
        type: string
    ratelimit_reset:
      description: Seconds until the current rate window resets.
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: os_ API key or OAuth access token
      description: >-
        Full-access keys / full_access OAuth required except sends also accept sending_access / emails:send.
        All credentials scoped to one team. SMTP rejects OAuth.
    oauthBearer:
      type: http
      scheme: bearer
      bearerFormat: OAuth access token
      description: OAuth bearer tokens with full_access, accepted alongside full-access API keys by REST routes.
  parameters:
    PaginationLimit:
      name: limit
      in: query
      description: Page size (default 20). All lists are bounded, including those Resend may return in full.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    PaginationAfter:
      name: after
      in: query
      description: Opaque resource id. Mutually exclusive with before. Unknown/foreign anchors return 422.
      schema:
        type: string
    PaginationBefore:
      name: before
      in: query
      description: Opaque resource id; newer page, still newest-first. Mutually exclusive with after.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: >-
        POST replay for 24 hours scoped to team and key value. Hash includes method, path and exact body
        bytes; changed request or concurrent request returns 409. Server errors release the key.
      schema:
        type: string
        minLength: 1
        maxLength: 256
  responses:
    Error400:
      description: >-
        validation_error, invalid_idempotency_key. Rate headers may be absent on refusal before rate
        accounting (authentication, body size).
      headers:
        ratelimit-limit:
          $ref: '#/components/headers/ratelimit_limit'
        ratelimit-remaining:
          $ref: '#/components/headers/ratelimit_remaining'
        ratelimit-reset:
          $ref: '#/components/headers/ratelimit_reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error400'
    Error401:
      description: >-
        missing_api_key, restricted_api_key. Rate headers may be absent on refusal before rate accounting
        (authentication, body size).
      headers:
        ratelimit-limit:
          $ref: '#/components/headers/ratelimit_limit'
        ratelimit-remaining:
          $ref: '#/components/headers/ratelimit_remaining'
        ratelimit-reset:
          $ref: '#/components/headers/ratelimit_reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error401'
    Error403:
      description: >-
        invalid_api_key, invalid_permission, validation_error. Rate headers may be absent on refusal before
        rate accounting (authentication, body size).
      headers:
        ratelimit-limit:
          $ref: '#/components/headers/ratelimit_limit'
        ratelimit-remaining:
          $ref: '#/components/headers/ratelimit_remaining'
        ratelimit-reset:
          $ref: '#/components/headers/ratelimit_reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error403'
    Error404:
      description: not_found. Rate headers may be absent on refusal before rate accounting (authentication, body size).
      headers:
        ratelimit-limit:
          $ref: '#/components/headers/ratelimit_limit'
        ratelimit-remaining:
          $ref: '#/components/headers/ratelimit_remaining'
        ratelimit-reset:
          $ref: '#/components/headers/ratelimit_reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error404'
    Error409:
      description: >-
        invalid_idempotent_request, concurrent_idempotent_requests. Rate headers may be absent on refusal
        before rate accounting (authentication, body size).
      headers:
        ratelimit-limit:
          $ref: '#/components/headers/ratelimit_limit'
        ratelimit-remaining:
          $ref: '#/components/headers/ratelimit_remaining'
        ratelimit-reset:
          $ref: '#/components/headers/ratelimit_reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error409'
    Error413:
      description: >-
        validation_error. Rate headers may be absent on refusal before rate accounting (authentication, body
        size).
      headers:
        ratelimit-limit:
          $ref: '#/components/headers/ratelimit_limit'
        ratelimit-remaining:
          $ref: '#/components/headers/ratelimit_remaining'
        ratelimit-reset:
          $ref: '#/components/headers/ratelimit_reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error413'
    Error422:
      description: >-
        validation_error, missing_required_field, invalid_attachment. Rate headers may be absent on refusal
        before rate accounting (authentication, body size).
      headers:
        ratelimit-limit:
          $ref: '#/components/headers/ratelimit_limit'
        ratelimit-remaining:
          $ref: '#/components/headers/ratelimit_remaining'
        ratelimit-reset:
          $ref: '#/components/headers/ratelimit_reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error422'
    Error429:
      description: >-
        rate_limit_exceeded. Rate headers may be absent on refusal before rate accounting (authentication,
        body size).
      headers:
        ratelimit-limit:
          $ref: '#/components/headers/ratelimit_limit'
        ratelimit-remaining:
          $ref: '#/components/headers/ratelimit_remaining'
        ratelimit-reset:
          $ref: '#/components/headers/ratelimit_reset'
        retry-after:
          description: Seconds until retry.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error429'
    Error500:
      description: >-
        application_error. Rate headers may be absent on refusal before rate accounting (authentication, body
        size).
      headers:
        ratelimit-limit:
          $ref: '#/components/headers/ratelimit_limit'
        ratelimit-remaining:
          $ref: '#/components/headers/ratelimit_remaining'
        ratelimit-reset:
          $ref: '#/components/headers/ratelimit_reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error500'
  schemas:
    DomainCapabilities:
      type: object
      properties:
        sending:
          anyOf:
            - type: string
              enum:
                - enabled
                - disabled
            - type: 'null'
          description: Enable or disable sending emails from this domain.
        receiving:
          anyOf:
            - type: string
              enum:
                - enabled
                - disabled
            - type: 'null'
          description: Enable or disable receiving emails to this domain.
      description: >-
        Configure the domain capabilities for sending and receiving emails. At least one capability must be
        enabled.
    Tag:
      type: object
      properties:
        name:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,256}$
          description: >-
            The name of the email tag. It can only contain ASCII letters (a–z, A–Z), numbers (0–9),
            underscores (_), or dashes (-). It can contain no more than 256 characters.
        value:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,256}$
          description: >-
            The value of the email tag.It can only contain ASCII letters (a–z, A–Z), numbers (0–9),
            underscores (_), or dashes (-). It can contain no more than 256 characters.
      required:
        - name
        - value
    Attachment:
      type: object
      properties:
        content:
          type: string
          description: Base64 file bytes; total encoded content at most 40 MiB. Whitespace is stripped before decoding.
        filename:
          type: string
          minLength: 1
          maxLength: 255
          description: Name of attached file.
        path:
          type: string
          format: uri
          description: Public HTTPS URL, DNS pinned; up to three redirects, each revalidated.
        content_type:
          anyOf:
            - type: string
              pattern: ^[A-Za-z0-9!#$&^_.+-]+/[A-Za-z0-9!#$&^_.+-]+$
            - type: 'null'
          description: Optional content type for the attachment, if not set it will be derived from the filename property
        content_id:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 78
            - type: 'null'
          description: Content ID for embedding inline images using cid references (e.g., cid:image001).
      required: []
      allOf:
        - anyOf:
            - required:
                - path
            - required:
                - content
                - filename
      description: >-
        Base64 content or a public HTTPS URL. Filename can be derived from a URL path. Download and combined
        base64 size limits apply.
    EmailTemplateInput:
      type: object
      properties:
        id:
          type: string
          description: Published template id or alias.
        variables:
          anyOf:
            - type: object
              additionalProperties:
                type:
                  - string
                  - number
            - type: 'null'
          description: Template variables object with key/value pairs.
      required:
        - id
    SendEmailRequest:
      type: object
      properties:
        from:
          anyOf:
            - type: string
            - type: 'null'
          description: Sender email address. To include a friendly name, use the format "Your Name <sender@domain.com>".
        to:
          oneOf:
            - type: string
              minLength: 1
            - type: array
              items:
                type: string
              minItems: 1
              maxItems: 50
        subject:
          anyOf:
            - type: string
            - type: 'null'
          description: Email subject.
        cc:
          anyOf:
            - oneOf:
                - type: string
                - type: array
                  items:
                    type: string
              description: Recipient email address. For multiple addresses, send as an array of strings. Max 50.
            - type: 'null'
          description: Cc recipient email address. For multiple addresses, send as an array of strings.
        bcc:
          anyOf:
            - oneOf:
                - type: string
                - type: array
                  items:
                    type: string
              description: Recipient email address. For multiple addresses, send as an array of strings. Max 50.
            - type: 'null'
          description: Bcc recipient email address. For multiple addresses, send as an array of strings.
        reply_to:
          anyOf:
            - oneOf:
                - type: string
                - type: array
                  items:
                    type: string
              description: Recipient email address. For multiple addresses, send as an array of strings. Max 50.
            - type: 'null'
          description: Reply-to email address. For multiple addresses, send as an array of strings.
        html:
          anyOf:
            - type: string
            - type: 'null'
          description: The HTML version of the message.
        text:
          anyOf:
            - type: string
            - type: 'null'
          description: The plain text version of the message.
        headers:
          anyOf:
            - type: object
              additionalProperties:
                type: string
            - type: 'null'
          description: Custom headers to add to the email.
        scheduled_at:
          anyOf:
            - type: string
              description: >-
                ISO 8601 or natural language, up to 30 days ahead. Unzoned expressions use UTC. Past send
                times queue immediately; rescheduling requires a future time.
            - type: 'null'
          description: Schedule email to be sent later. The date should be in ISO 8601 format.
        attachments:
          anyOf:
            - type: array
              items:
                $ref: '#/components/schemas/Attachment'
            - type: 'null'
        tags:
          anyOf:
            - type: array
              items:
                $ref: '#/components/schemas/Tag'
              maxItems: 48
            - type: 'null'
        template:
          anyOf:
            - $ref: '#/components/schemas/EmailTemplateInput'
            - type: 'null'
        topic_id:
          type:
            - string
            - 'null'
          description: >-
            Team topic. Each to/cc/bcc recipient is checked at delivery; explicit choices override its
            default. Unsubscribed recipients fail.
      required:
        - to
      description: >-
        Requires a nonempty to and a sender/subject from explicit fields or a published template, plus
        html/text or template. Template cannot accompany non-null html/text. Combined to/cc/bcc cap 50; 50
        headers, 48 tags, 900000 UTF-8 bytes of HTML/text/headers. At most 40 MiB encoded attachments. Unknown
        JSON fields are ignored, including react; render react in the SDK. Verified sender, SES
        tenant/configuration set and current IAM policy required. Suppressed recipients are removed before
        submission; no automatic unsubscribe headers. See docs/rest-api.md for SES restrictions.
      allOf:
        - anyOf:
            - required:
                - template
              properties:
                template:
                  $ref: '#/components/schemas/EmailTemplateInput'
            - required:
                - from
                - subject
              properties:
                from:
                  type: string
                  minLength: 1
                subject:
                  type: string
                  minLength: 1
        - anyOf:
            - required:
                - template
              properties:
                template:
                  $ref: '#/components/schemas/EmailTemplateInput'
                html:
                  type: 'null'
                text:
                  type: 'null'
            - required:
                - html
              properties:
                html:
                  type: string
                  minLength: 1
                template:
                  type: 'null'
            - required:
                - text
              properties:
                text:
                  type: string
                  minLength: 1
                template:
                  type: 'null'
    BatchEmailRequest:
      type: object
      properties:
        from:
          anyOf:
            - type: string
            - type: 'null'
        to:
          oneOf:
            - type: string
              minLength: 1
            - type: array
              items:
                type: string
              minItems: 1
              maxItems: 50
        subject:
          anyOf:
            - type: string
            - type: 'null'
        cc:
          anyOf:
            - oneOf:
                - type: string
                - type: array
                  items:
                    type: string
            - type: 'null'
        bcc:
          anyOf:
            - oneOf:
                - type: string
                - type: array
                  items:
                    type: string
            - type: 'null'
        reply_to:
          anyOf:
            - oneOf:
                - type: string
                - type: array
                  items:
                    type: string
            - type: 'null'
        html:
          anyOf:
            - type: string
            - type: 'null'
        text:
          anyOf:
            - type: string
            - type: 'null'
        headers:
          anyOf:
            - type: object
              additionalProperties:
                type: string
            - type: 'null'
        scheduled_at:
          anyOf:
            - type: string
              description: >-
                ISO 8601 or natural language, up to 30 days ahead. Unzoned expressions use UTC. Past send
                times queue immediately; rescheduling requires a future time.
            - type: 'null'
        attachments:
          anyOf:
            - type: array
              items:
                $ref: '#/components/schemas/Attachment'
              maxItems: 0
            - type: 'null'
        tags:
          anyOf:
            - type: array
              items:
                $ref: '#/components/schemas/Tag'
              maxItems: 48
            - type: 'null'
        template:
          anyOf:
            - $ref: '#/components/schemas/EmailTemplateInput'
            - type: 'null'
        topic_id:
          type:
            - string
            - 'null'
          description: >-
            Team topic. Each to/cc/bcc recipient is checked at delivery; explicit choices override its
            default. Unsubscribed recipients fail.
      required:
        - to
      description: >-
        Same validation as SendEmailRequest; attachments unsupported. Strict mode rolls the whole batch back.
        Permissive mode returns successful ids and indexed errors. Total JSON limit 1 MiB.
      allOf:
        - anyOf:
            - required:
                - template
              properties:
                template:
                  $ref: '#/components/schemas/EmailTemplateInput'
            - required:
                - from
                - subject
              properties:
                from:
                  type: string
                  minLength: 1
                subject:
                  type: string
                  minLength: 1
        - anyOf:
            - required:
                - template
              properties:
                template:
                  $ref: '#/components/schemas/EmailTemplateInput'
                html:
                  type: 'null'
                text:
                  type: 'null'
            - required:
                - html
              properties:
                html:
                  type: string
                  minLength: 1
                template:
                  type: 'null'
            - required:
                - text
              properties:
                text:
                  type: string
                  minLength: 1
                template:
                  type: 'null'
    SendEmailResponse:
      type: object
      properties:
        id:
          type: string
          description: The ID of the sent email.
      required:
        - id
      additionalProperties: false
    EmailListItem:
      type: object
      properties:
        id:
          type: string
          description: Opaque Convex document id, not a UUID.
        message_id:
          anyOf:
            - type: string
            - type: 'null'
        to:
          type: array
          items:
            type: string
        from:
          type: string
        created_at:
          type: string
          description: UTC PostgreSQL-style timestamp, e.g. 2026-09-29 12:00:00.000000+00.
        subject:
          type: string
        bcc:
          anyOf:
            - type: array
              items:
                type: string
            - type: 'null'
        cc:
          anyOf:
            - type: array
              items:
                type: string
            - type: 'null'
        reply_to:
          anyOf:
            - type: array
              items:
                type: string
            - type: 'null'
        last_event:
          type: string
          enum:
            - queued
            - scheduled
            - sent
            - delivered
            - delivery_delayed
            - opened
            - clicked
            - bounced
            - complained
            - failed
            - canceled
            - suppressed
        scheduled_at:
          anyOf:
            - type: string
              description: UTC PostgreSQL-style timestamp, e.g. 2026-09-29 12:00:00.000000+00.
            - type: 'null'
      required:
        - id
