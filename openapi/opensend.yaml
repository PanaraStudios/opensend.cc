        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
  /contacts:
    post:
      operationId: contacts/create
      tags:
        - Contacts
      summary: Create a new contact
      description: >-
        Upserts case-insensitive email, merging supplied fields and memberships. audience_id aliases segment
        membership when segments is omitted. Property keys must already exist; values match their
        string/number definition. Empty strings and null clear property values. Names and stored property
        values cap 1000 characters. Teams cap 100 properties, 500 segments, 100 topics. Requires full_access
        credentials. Unknown query/body fields are ignored unless documented otherwise.
      x-opensend-permission: full_access
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContactOptions'
      responses:
        '201':
          description: OK
          headers:
            ratelimit-limit:
              $ref: '#/components/headers/ratelimit_limit'
            ratelimit-remaining:
              $ref: '#/components/headers/ratelimit_remaining'
            ratelimit-reset:
              $ref: '#/components/headers/ratelimit_reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateContactResponseSuccess'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
    get:
      operationId: contacts/list
      tags:
        - Contacts
      summary: Retrieve a list of contacts
      description: Requires full_access credentials. Unknown query/body fields are ignored unless documented otherwise.
      x-opensend-permission: full_access
      parameters:
        - $ref: '#/components/parameters/PaginationLimit'
        - $ref: '#/components/parameters/PaginationAfter'
        - $ref: '#/components/parameters/PaginationBefore'
        - name: segment_id
          in: query
          schema:
            type: string
          description: Restrict to segment memberships, newest membership first.
      responses:
