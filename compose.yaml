name: opensend
services:
  convex:
    image: ${CONVEX_IMAGE:-ghcr.io/get-convex/convex-backend@sha256:1b0dcd93a3d126400d16e256aea1106a2ee9538882dda545d2c979f28cff1483}
    restart: unless-stopped
    stop_grace_period: 20s
    stop_signal: SIGINT
    ports:
      - "127.0.0.1:${CONVEX_PORT:-3210}:3210"
      - "127.0.0.1:${CONVEX_SITE_PORT:-3211}:3211"
    environment:
      INSTANCE_NAME: ${INSTANCE_NAME}
      INSTANCE_SECRET: ${INSTANCE_SECRET}
      CONVEX_CLOUD_ORIGIN: ${CONVEX_BACKEND_ORIGIN:-http://host.docker.internal:3210}
      CONVEX_SITE_ORIGIN: ${CONVEX_PUBLIC_SITE_URL:-http://localhost:3211}
      DISABLE_BEACON: "true"
      REDACT_LOGS_TO_CLIENT: "true"
      DOCUMENT_RETENTION_DELAY: ${DOCUMENT_RETENTION_DELAY:-172800}
    volumes:
      - convex-data:/convex/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3210/version"]
      interval: 5s
      timeout: 3s
      retries: 30
  dashboard:
    profiles: [debug]
    image: ${CONVEX_DASHBOARD_IMAGE:-ghcr.io/get-convex/convex-dashboard@sha256:63e94c62940a09acd36464e02e1b0a7589f7ef48227003de78510f9523bb4e6b}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-6791}:6791"
    environment:
      NEXT_PUBLIC_DEPLOYMENT_URL: ${CONVEX_PUBLIC_URL:-http://localhost:3210}
    depends_on:
      convex:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:6791').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
  migrate:
    image: ${MIGRATE_IMAGE:-ghcr.io/panarastudios/opensend-migrate:${OPENSEND_VERSION:-latest}}
    build:
      context: .
      target: migrate
    restart: "no"
    depends_on:
      convex:
        condition: service_healthy
    environment:
      CONVEX_SELF_HOSTED_URL: http://convex:3210
      CONVEX_SELF_HOSTED_ADMIN_KEY: ${CONVEX_SELF_HOSTED_ADMIN_KEY}
      SITE_URL: ${SITE_URL:-}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:-}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-}
      OBJECT_STORAGE_PUBLIC_BASE_URL: ${OBJECT_STORAGE_PUBLIC_BASE_URL:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      SSO_ENCRYPTION_KEY: ${SSO_ENCRYPTION_KEY:-}
      SES_ENCRYPTION_KEY: ${SES_ENCRYPTION_KEY:-}
      SES_CALLBACK_ORIGIN: ${SES_CALLBACK_ORIGIN:-}
      ALLOW_LOCAL_OIDC: ${ALLOW_LOCAL_OIDC:-}
      META_GRAPH_ORIGIN: ${META_GRAPH_ORIGIN:-}
      LOG_AUTH_LINKS: ${LOG_AUTH_LINKS:-}
      DOMAIN_CONNECT_KEY: ${DOMAIN_CONNECT_KEY:-}
      DOMAIN_CONNECT_PRIVATE_KEY: ${DOMAIN_CONNECT_PRIVATE_KEY:-}
      DOMAIN_CONNECT_SIGNER: ${DOMAIN_CONNECT_SIGNER:-}
      SMTP_HOST: ${SMTP_HOST:-}
  app:
    image: ${APP_IMAGE:-ghcr.io/panarastudios/opensend-app:${OPENSEND_VERSION:-latest}}
    build:
      context: .
      target: app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      CONVEX_INTERNAL_URL: http://convex:3210
      CONVEX_INTERNAL_SITE_URL: http://convex:3211
      CONVEX_PUBLIC_URL: ${CONVEX_PUBLIC_URL:-http://localhost:3210}
    depends_on:
      convex:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
  smtp:
    image: ${SMTP_IMAGE:-ghcr.io/panarastudios/opensend-smtp:${OPENSEND_VERSION:-latest}}
    profiles: [smtp]
    build:
      context: .
      dockerfile: docker/smtp/Dockerfile
    restart: unless-stopped
    stop_grace_period: 40s
    ports:
      - "${SMTP_TLS_PUBLIC_PORT:-465}:2465"
      - "${SMTP_STARTTLS_PUBLIC_PORT:-587}:2587"
    environment:
      SMTP_CONVEX_SITE_URL: http://convex:3211
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_TLS_KEY_PATH: /certs/privkey.pem
      SMTP_TLS_CERT_PATH: /certs/fullchain.pem
      SMTP_MAX_MESSAGE_BYTES: ${SMTP_MAX_MESSAGE_BYTES:-41943040}
    volumes:
      - ${SMTP_CERT_DIR:-./docker/smtp/certs}:/certs:ro
    depends_on:
      convex:
        condition: service_healthy
  janus:
    profiles: [calling]
    image: opensend-janus:1.2.3
    build:
      context: docker/janus
    restart: unless-stopped
    ports:
      - "20000-20199:20000-20199/udp"
    environment:
      JANUS_API_SECRET: ${JANUS_API_SECRET:-}
      JANUS_STUN_SERVER: ${JANUS_STUN_SERVER-stun.l.google.com}
      JANUS_STUN_PORT: ${JANUS_STUN_PORT:-19302}
      JANUS_PUBLIC_IP: ${JANUS_PUBLIC_IP:-}
    volumes:
      - janus-certs:/certs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8088/janus/info"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
  freeswitch:
    profiles: [calling]
    image: opensend-freeswitch:1.10.12
    build:
      context: docker/freeswitch
    restart: unless-stopped
    stop_grace_period: 20s
    ports:
      - "${CALLING_WSS_PORT:-7443}:7443/tcp"
      - "20400-20799:20400-20799/udp"
    environment:
      FREESWITCH_ESL_SECRET: ${FREESWITCH_ESL_SECRET:-}
      FREESWITCH_SIP_SECRET: ${FREESWITCH_SIP_SECRET:-}
      FREESWITCH_DIRECTORY_SECRET: ${FREESWITCH_DIRECTORY_SECRET:-}
      FREESWITCH_PUBLIC_IP: ${FREESWITCH_PUBLIC_IP:-auto}
    volumes:
      - ${FREESWITCH_CERT_DIR:-freeswitch-certs}:/certs
      - calling-recordings:/recordings
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/freeswitch/bin/fs_cli -H 127.0.0.1 -p "$$FREESWITCH_ESL_SECRET" -x status | grep -q ''UP'' && /opt/freeswitch/bin/fs_cli -H 127.0.0.1 -p "$$FREESWITCH_ESL_SECRET" -x ''sofia status'' | grep -q ''internal.*RUNNING'' && /opt/freeswitch/bin/fs_cli -H 127.0.0.1 -p "$$FREESWITCH_ESL_SECRET" -x ''module_exists mod_xml_curl'' | grep -q ''true'' ',
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
  call-gateway:
    profiles: [calling]
    image: opensend-call-gateway:0.1.0
    build:
      context: .
      dockerfile: services/call-gateway/Dockerfile
      target: runtime
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    ports:
      - "127.0.0.1:${CALL_GATEWAY_PORT:-8090}:8090"
    environment:
      CALL_GATEWAY_SECRET: ${CALL_GATEWAY_SECRET:-}
      CALL_GATEWAY_CONVEX_HTTP_URL: ${CALL_GATEWAY_CONVEX_HTTP_URL:-http://convex:3211}
      JANUS_URL: http://janus:8088/janus
      JANUS_ADMIN_URL: http://janus:7088/admin
      JANUS_API_SECRET: ${JANUS_API_SECRET:-}
      FREESWITCH_DIRECTORY_SECRET: ${FREESWITCH_DIRECTORY_SECRET:-}
      CALL_AGENT_QUEUES: '${CALL_AGENT_QUEUES:-{}}'
      FREESWITCH_HOST: freeswitch
      FREESWITCH_ESL_SECRET: ${FREESWITCH_ESL_SECRET:-}
      FREESWITCH_SIP_SECRET: ${FREESWITCH_SIP_SECRET:-}
    depends_on:
      janus:
        condition: service_healthy
      freeswitch:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8090/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
  # Opt in with --profile calling-turn in addition to --profile calling.
  coturn:
    profiles: [calling-turn]
    image: opensend-coturn:4.6
    build:
      context: docker/coturn
    restart: unless-stopped
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "20800-20999:20800-20999/udp"
    environment:
      CALL_TURN_PUBLIC_IP: ${CALL_TURN_PUBLIC_IP:-}
      CALL_TURN_PASSWORD: ${CALL_TURN_PASSWORD:-}
  oidc:
    image: quay.io/keycloak/keycloak:26.3.3@sha256:6a7217a100bd3e5de4063a27a538ef999a3c5a88c4b4ec0ffc0a642aee7b2597
    profiles: [oidc-test]
    command: [start-dev, --import-realm]
    ports:
      - "127.0.0.1:${OIDC_PORT:-8080}:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: test-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${OIDC_ADMIN_PASSWORD:-local-test-only}
      KC_HOSTNAME: http://host.docker.internal:${OIDC_PORT:-8080}
    volumes:
      - ${OIDC_REALM_FILE:-./docker/oidc-realm.json}:/opt/keycloak/data/import/opensend.json:ro
volumes:
  convex-data:
  janus-certs:
  freeswitch-certs:
  calling-recordings:
