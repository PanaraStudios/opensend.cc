[project]
name = "opensend-voice-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pipecat-ai[sarvam,elevenlabs,google,silero]==1.12.0",
  "fastapi==0.118.0",
  "uvicorn==0.37.0",
  "httpx==0.28.1",
  "websockets==15.0.1",
]

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0", "ruff==0.13.2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
