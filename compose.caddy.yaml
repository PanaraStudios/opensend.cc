# Optional HTTPS reverse proxy for servers where nothing else terminates TLS.
# Skip it on platforms that bring their own proxy (Dokploy, Coolify, Traefik).
#   docker compose -f compose.yaml -f compose.caddy.yaml --env-file .env.docker up -d
services:
  caddy:
    image: ${CADDY_IMAGE:-caddy:2.11.4@sha256:0c994536bddb66445885237f1a5dcc1916bccea922661c76b4e9fc24061f9b52}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_URL: ${SITE_URL:?Set SITE_URL in .env.docker to the dashboard's https:// URL}
      CONVEX_PUBLIC_URL: ${CONVEX_PUBLIC_URL:?Set CONVEX_PUBLIC_URL in .env.docker to the realtime https:// URL, such as https://realtime.example.com}
      CONVEX_PUBLIC_SITE_URL: ${CONVEX_PUBLIC_SITE_URL:?Set CONVEX_PUBLIC_SITE_URL in .env.docker to the API https:// URL, such as https://api.example.com}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
      convex:
        condition: service_healthy
  app:
    # Caddy is the only public entry point.
    ports: !override
      - "127.0.0.1:${APP_PORT:-3000}:3000"
volumes:
  caddy-data:
  caddy-config:
