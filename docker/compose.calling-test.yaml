# Lead-only harness overlay. Do not deploy: substitutes Convex callbacks with a fake server.
services:
  janus:
    environment:
      JANUS_STUN_SERVER: ""
      JANUS_PUBLIC_IP: ""
  call-gateway:
    environment:
      CALL_GATEWAY_CONVEX_HTTP_URL: http://meta-peer:8091
  meta-peer:
    profiles: [calling-test]
    image: opensend-calling-harness:0.1.0
    build:
      context: .
      dockerfile: services/call-gateway/Dockerfile
      target: harness
    environment:
      CALL_GATEWAY_URL: http://call-gateway:8090
      CALL_GATEWAY_SECRET: ${CALL_GATEWAY_SECRET:-}
      JANUS_ADMIN_URL: http://janus:7088/admin
      JANUS_API_SECRET: ${JANUS_API_SECRET:-}
    volumes:
      - calling-recordings:/recordings:ro
    depends_on:
      call-gateway:
        condition: service_healthy
