services:
  minio:
    build:
      context: ./docker/e2e-minio
    restart: "no"
    command: [server, /data]
    ports:
      - "127.0.0.1:${MINIO_PORT}:9000"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_ACCESS_KEY}
    volumes:
      - minio-test-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 60
volumes:
  minio-test-data:
